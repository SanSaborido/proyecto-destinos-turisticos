```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto de Rumbo Libre.">
    <title>Rumbo Libre - Contacto</title>
    <link rel="stylesheet" href="estilosIA.css">
</head>

<body>

    <header class="encabezado">
        <div class="contenedor">
            <a href="index.html" class="logo">Rumbo Libre</a>

            <nav class="navegacion">
                <a href="index.html">Inicio</a>
                <a href="playa.html">Playa</a>
                <a href="montana.html">Montaña</a>
                <a href="contacto.html" class="activo">Contacto</a>
                <a href="acerca.html">Acerca de</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="pagina-simple">
            <div class="contenedor">

                <div class="titulo-seccion">
                    <p class="etiqueta">CONTACTO</p>
                    <h1>Hablemos de tu próximo viaje</h1>
                    <p>
                        ¿Tenés una consulta, sugerencia o querés
                        contarnos sobre tu próximo destino?
                    </p>
                </div>

                <div class="formulario-contenedor">

                    <form class="formulario" action="#" method="post">

                        <div class="campo">
                            <label for="nombre">Nombre</label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="Tu nombre"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="email">Email</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="tuemail@ejemplo.com"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="mensaje">Mensaje</label>

                            <textarea
                                id="mensaje"
                                name="mensaje"
                                rows="7"
                                placeholder="Escribí tu mensaje..."
                                required
                            ></textarea>
                        </div>

                        <button type="submit" class="boton boton-principal">
                            Enviar mensaje
                        </button>

                    </form>

                </div>

            </div>
        </section>

    </main>

    <footer class="pie">
        <div class="contenedor pie-contenido">
            <p>© 2026 Rumbo Libre</p>

            <div>
                <a href="contacto.html">Contacto</a>
                <a href="acerca.html">Acerca de</a>
            </div>
        </div>
    </footer>

</body>
</html>
```
